<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stellwerk Sieg – Zweiter Monitor</title>
    <link rel="stylesheet" href="/src/monitor.css" />
    <link rel="stylesheet" href="/src/monitor-light.css" />
  </head>
  <body>
    <header>
      <div class="brand">◆ Stellwerk Sieg <span>Zweiter Monitor</span></div>
      <div id="clock">--:--:--</div>
      <div id="conn" class="off">keine Verbindung zum Stellwerk</div>
      <div class="stats" id="stats"></div>
    </header>
    <main>
      <section id="board">
        <div class="head"><select id="station"></select>
          <div class="seg"><button data-m="dep" class="on">Abfahrt</button><button data-m="arr">Ankunft</button></div></div>
        <div class="scroll"><table id="boardTab"></table></div>
      </section>
      <section id="graph"><div class="head"><b>Bildfahrplan</b> <span class="hint">gestrichelt = Plan, durchgezogen = Ist, dünn = Prognose · Zug anklicken</span>
        <div class="seg"><button data-r="60">1 h</button><button data-r="120" class="on">2 h</button><button data-r="240">4 h</button></div></div>
        <canvas id="cv"></canvas><div id="gtip" class="hidden"></div></section>
      <section id="side">
        <nav class="mtabs">
          <button data-tab="lage" class="on">Lage <i id="nLage"></i></button>
          <button data-tab="dispo">Dispo <i id="nDispo"></i></button>
          <button data-tab="funk">Funk</button>
          <button data-tab="gleis">Bahnsteig</button>
          <button data-tab="ansage">Ansagen</button>
          <button data-tab="log">Meldungen</button>
          <button data-tab="book">Arbeitsbuch</button>
        </nav>
        <div class="pane" id="p-lage"></div>
        <div class="pane hidden" id="p-dispo"></div>
        <div class="pane hidden" id="p-funk"></div>
        <div class="pane hidden" id="p-gleis"></div>
        <div class="pane hidden" id="p-ansage"></div>
        <div class="pane hidden" id="p-log"></div>
        <div class="pane hidden" id="p-book"></div>
      </section>
    </main>
    <div id="mtoast"></div>
    <script type="module" src="/src/monitor.ts"></script>
  </body>
</html>
